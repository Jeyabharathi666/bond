name: Run WINT Bonds Scraper Every 5 Hours

on:
  schedule:
    - cron: '0 */3 * * *'  # every 5 hours at minute 0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-scrapers:
    runs-on: ubuntu-22.04  # fixed to Ubuntu 22.04

    env:
      NEW: ${{ secrets.NEW }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🧪 List files (debug)
        run: ls -R

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tf-playwright-stealth
          python -m playwright install

      #- name: 🚀 Run WINT scraper
        #run: python wint.py
      - name: 🚀 Run INDIABOND
        run: python indiabonds.py
      # - name: 🚀 Run High Rated
      #   run: python Hirated.py
      # - name: 🚀 Run Tax Benefit
      #   run: python taxben.py
        

